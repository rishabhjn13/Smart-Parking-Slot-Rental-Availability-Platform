name: Frontend CI

# Trigger the workflow on pushes or pull requests to the main branch [cite: 11, 12]
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-tests:
    [cite_start]runs-on: ubuntu-latest [cite: 13]

    steps:
      # Step 1: Check out the code [cite: 14]
      - name: Checkout repository
        [cite_start]uses: actions/checkout@v4 [cite: 14]

      # Step 2: Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Matches modern React 19 / Vite ecosystems
          cache: 'npm'
          cache-dependency-path: 'frontend-build01/package-lock.json' # Caches npm deps for speed

      # Step 3: Install dependencies inside the subdirectory
      - name: Install dependencies
        run: npm ci
        working-directory: frontend-build01

      # Step 4: Run Code Linting (Optional but highly recommended)
      - name: Run Linter
        run: npm run lint
        working-directory: frontend-build01

      # Step 5: Run Type Checking (Ensures TypeScript compiling works)
      - name: Type Check
        run: npm run build
        working-directory: frontend-build01

      # Step 6: Execute the tests
      - name: Run Tests
        run: npm run test
        working-directory: frontend-build01