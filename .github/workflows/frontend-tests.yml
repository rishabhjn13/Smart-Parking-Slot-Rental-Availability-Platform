name: Frontend CI

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend-build01/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: frontend-build01

      - name: Run Linter
        run: npm run lint
        working-directory: frontend-build01

      - name: Type Check
        run: npm run build
        working-directory: frontend-build01

      - name: Run Tests
        run: npm run test
        working-directory: frontend-build01
